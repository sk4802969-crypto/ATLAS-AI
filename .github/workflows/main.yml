name: Build ATLAS AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android SDK Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev libsqlite3-dev \
            libbz2-dev libreadline-dev \
            libgdbm-dev libgdbm-compat-dev \
            liblzma-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install buildozer cython==0.29.36

      - name: Clear previous build files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
          PIP_VERSION: "24.3.1"
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-APK
          path: bin/*.apk
          if-no-files-found: error
