name: Build ATLAS AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev
          python -m pip install --upgrade "pip<25"
          pip install buildozer cython==0.29.36

      - name: Pin python-for-android
        run: |
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git p4a
          echo "P4A_DIR=$GITHUB_WORKSPACE/p4a" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          PIP_VERSION: 24.3.1
        run: |
          export BUILDOZER_ANDROID_P4A_DIR="$P4A_DIR"
          yes | buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-AI-APK
          path: bin/*.apk
          if-no-files-found: error
